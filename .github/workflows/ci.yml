name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Static & Generated Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned grammar sources
        uses: actions/cache@v4
        with:
          path: grammar-deps
          key: grammar-deps-${{ hashFiles('deps/grammar-sources.lock.json') }}

      - name: Fetch pinned grammar sources
        run: |
          python3 scripts/fetch_pinned_repos.py \
            --lock deps/grammar-sources.lock.json \
            --dest grammar-deps

      - name: Verify generated grammar tables
        run: |
          python3 scripts/gen_grammar_tables.py \
            --grammar-dir grammar-deps/spirv-headers/include/spirv/unified1 \
            --check

      - name: Verify wire-format tuning lock & header C99/C11/C++17 strictness
        run: |
          if grep -rn '#ifndef ARIXV_K' src/ include/ --exclude=tuning.h; then
            echo "ERROR: Found #ifndef ARIXV_K outside src/tuning.h"
            exit 1
          fi
          if g++ -std=c++17 -Iinclude -Isrc -DARIXV_KPROB_BITS=10 -fsyntax-only src/arixv.cpp 2>/dev/null; then
            echo "ERROR: Expected -DARIXV_KPROB_BITS override without ARIXV_RESEARCH_TUNING to fail"
            exit 1
          fi
          if g++ -std=c++17 -Iinclude -Isrc -DARIXV_BUILDING -DARIXV_RESEARCH_TUNING -DARIXV_KPROB_BITS=10 -fsyntax-only src/arixv.cpp 2>/dev/null; then
            echo "ERROR: Expected ARIXV_RESEARCH_TUNING combined with ARIXV_BUILDING to fail"
            exit 1
          fi
          for std in c99 c11 c17; do
            for def in "" "-DARIXV_ENCODER=" "-DARIXV_ENCODER=0" "-DARIXV_ENCODER=1"; do
              printf '#include <arixv/arixv.h>\nint arixv_hdr_check(void) { return (int)ARIXV_HEADER_INFO_V1_SIZE; }\n' | \
                gcc -x c -std="$std" -Wall -Wextra -Wpedantic -Werror -Iinclude $def -fsyntax-only -
            done
          done

  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc
            cxx: g++
            run_tsan: true
          - name: clang
            cc: clang
            cxx: clang++
            run_tsan: false
    steps:
      - uses: actions/checkout@v4

      - name: Build and test (Release SIMD + static)
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build/rel -DCMAKE_BUILD_TYPE=Release
          cmake --build build/rel -j
          ctest --test-dir build/rel --output-on-failure

      - name: Build and test (Release scalar / ARIXV_NO_SIMD)
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build/scalar -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-DARIXV_NO_SIMD"
          cmake --build build/scalar -j
          ctest --test-dir build/scalar --output-on-failure

      - name: Build and test (-fno-exceptions -fno-rtti)
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build/noexc -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-fno-exceptions -fno-rtti"
          cmake --build build/noexc -j
          ctest --test-dir build/noexc --output-on-failure

      - name: Build and test (decoder-only static + shared + export check)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build/dec -DCMAKE_BUILD_TYPE=Release \
            -DARIXV_BUILD_ENCODER=OFF -DARIXV_BUILD_CLI=OFF -DARIXV_BUILD_TOOLS=OFF
          cmake --build build/dec -j
          ctest --test-dir build/dec --output-on-failure
          cmake --install build/dec --prefix "$PWD/build/install-dec-static"

          cmake -S . -B build/dec-shared -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DARIXV_BUILD_ENCODER=OFF -DARIXV_BUILD_CLI=OFF -DARIXV_BUILD_TOOLS=OFF
          cmake --build build/dec-shared -j
          ctest --test-dir build/dec-shared --output-on-failure
          exported=$(nm -D --defined-only build/dec-shared/libarixv_decoder.so | awk '$2 != "A" {print $3}' | sort)
          expected=$(printf '%s\n' arixv_decode@@ARIXV_1.0 arixv_inspect@@ARIXV_1.0 arixv_status_string@@ARIXV_1.0 arixv_version@@ARIXV_1.0 arixv_pack_decode@@ARIXV_1.1 arixv_pack_decode_stage1@@ARIXV_1.1 arixv_pack_decode_stage2@@ARIXV_1.1 arixv_pack_inspect@@ARIXV_1.1 arixv_pack_inspect_modules@@ARIXV_1.1 arixv_pack_reset_scratch@@ARIXV_1.1 | sort)
          if [ "$exported" != "$expected" ]; then
            echo "ERROR: Unexpected exported symbols in decoder-only libarixv_decoder.so:"
            echo "$exported"
            exit 1
          fi
          readelf -d build/dec-shared/libarixv_decoder.so | grep -q 'SONAME.*\[libarixv_decoder\.so\.1\]'
          cmake --install build/dec-shared --prefix "$PWD/build/install-dec-shared"

          # ARIXV_BUILD_PACK=OFF: the 1.0-sized decoder exports exactly the 1.0 set.
          cmake -S . -B build/dec-nopack -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DARIXV_BUILD_PACK=OFF \
            -DARIXV_BUILD_ENCODER=OFF -DARIXV_BUILD_CLI=OFF -DARIXV_BUILD_TOOLS=OFF
          cmake --build build/dec-nopack -j
          ctest --test-dir build/dec-nopack --output-on-failure
          exported=$(nm -D --defined-only build/dec-nopack/libarixv_decoder.so | awk '$2 != "A" {print $3}' | sort)
          expected=$(printf '%s\n' arixv_decode@@ARIXV_1.0 arixv_inspect@@ARIXV_1.0 arixv_status_string@@ARIXV_1.0 arixv_version@@ARIXV_1.0 | sort)
          if [ "$exported" != "$expected" ]; then
            echo "ERROR: Unexpected exported symbols in ARIXV_BUILD_PACK=OFF libarixv_decoder.so:"
            echo "$exported"
            exit 1
          fi

          for kind in static shared; do
            for lang in C CXX; do
              bdir="build/consumer-dec-${kind}-${lang}"
              cmake -S tests/consumer -B "$bdir" \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$PWD/build/install-dec-${kind}" \
                -DARIXV_CONSUMER_LANG="$lang" \
                -DARIXV_CONSUMER_MODE=find_package \
                -DARIXV_CONSUMER_TARGETS=decoder
              cmake --build "$bdir" -j
              "./$bdir/consumer_smoke"
            done
          done

      - name: Build, test, and verify shared library + C11/C++17 consumer smoke tests
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          # Static install + find_package consumers (C11 & C++17; decoder, encoder, both)
          cmake --install build/rel --prefix "$PWD/build/install-static"
          for lang in C CXX; do
            for tgt in decoder encoder both; do
              bdir="build/consumer-static-${lang}-${tgt}"
              cmake -S tests/consumer -B "$bdir" \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$PWD/build/install-static" \
                -DARIXV_CONSUMER_LANG="$lang" \
                -DARIXV_CONSUMER_MODE=find_package \
                -DARIXV_CONSUMER_TARGETS="$tgt"
              cmake --build "$bdir" -j
              "./$bdir/consumer_smoke"
            done
          done

          # Shared build + CTest + verify ONLY the ARIXV_1.0/1.1 C arixv_* symbols are exported
          cmake -S . -B build/shared -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON
          cmake --build build/shared -j
          ctest --test-dir build/shared --output-on-failure
          exported=$(nm -D --defined-only build/shared/libarixv.so | awk '$2 != "A" {print $3}' | sort)
          expected=$(printf '%s\n' arixv_decode@@ARIXV_1.0 arixv_encode@@ARIXV_1.0 arixv_encode_bound@@ARIXV_1.0 arixv_inspect@@ARIXV_1.0 arixv_status_string@@ARIXV_1.0 arixv_version@@ARIXV_1.0 arixv_pack_decode@@ARIXV_1.1 arixv_pack_decode_stage1@@ARIXV_1.1 arixv_pack_decode_stage2@@ARIXV_1.1 arixv_pack_inspect@@ARIXV_1.1 arixv_pack_inspect_modules@@ARIXV_1.1 arixv_pack_reset_scratch@@ARIXV_1.1 arixv_pack_encode@@ARIXV_1.1 arixv_pack_encode_bound@@ARIXV_1.1 | sort)
          if [ "$exported" != "$expected" ]; then
            echo "ERROR: Unexpected exported symbols in libarixv.so:"
            echo "$exported"
            exit 1
          fi
          readelf -d build/shared/libarixv.so | grep -q 'SONAME.*\[libarixv\.so\.1\]'

          # Shared install + find_package consumers (C11 & C++17; decoder, encoder, both)
          cmake --install build/shared --prefix "$PWD/build/install-shared"
          for lang in C CXX; do
            for tgt in decoder encoder both; do
              bdir="build/consumer-shared-${lang}-${tgt}"
              cmake -S tests/consumer -B "$bdir" \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$PWD/build/install-shared" \
                -DARIXV_CONSUMER_LANG="$lang" \
                -DARIXV_CONSUMER_MODE=find_package \
                -DARIXV_CONSUMER_TARGETS="$tgt"
              cmake --build "$bdir" -j
              "./$bdir/consumer_smoke"
            done
          done

          # FetchContent consumers (static + shared; C11 & C++17; decoder, encoder, both)
          for shared in OFF ON; do
            for lang in C CXX; do
              for tgt in decoder encoder both; do
                bdir="build/consumer-fc-${shared}-${lang}-${tgt}"
                cmake -S tests/consumer -B "$bdir" \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DBUILD_SHARED_LIBS="$shared" \
                  -DARIXV_CONSUMER_LANG="$lang" \
                  -DARIXV_CONSUMER_MODE=fetchcontent \
                  -DARIXV_CONSUMER_SOURCE_DIR="$PWD" \
                  -DARIXV_CONSUMER_TARGETS="$tgt"
                cmake --build "$bdir" -j
                "./$bdir/consumer_smoke"
              done
            done
          done

      - name: Build and test (ASan + UBSan)
        env:
          CXX: ${{ matrix.cxx }}
          ASAN_OPTIONS: detect_leaks=0
          LSAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build/asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/asan -j
          ctest --test-dir build/asan --output-on-failure

      - name: Build and test (TSan)
        if: matrix.run_tsan
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build/tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-O2 -g -fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build/tsan -j
          ctest --test-dir build/tsan --output-on-failure

  linux-32bit:
    name: Linux 32-bit (ILP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit multilib toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib

      - name: Build and test (32-bit SSE2 + scalar)
        run: |
          cmake -S . -B build/i386 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-m32 -msse2" \
            -DCMAKE_EXE_LINKER_FLAGS="-m32" \
            -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build build/i386 -j
          ctest --test-dir build/i386 --output-on-failure

          cmake -S . -B build/i386-scalar -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-m32 -DARIXV_NO_SIMD" \
            -DCMAKE_EXE_LINKER_FLAGS="-m32" \
            -DCMAKE_SHARED_LINKER_FLAGS="-m32"
          cmake --build build/i386-scalar -j
          ctest --test-dir build/i386-scalar --output-on-failure

  macos-arm64:
    name: macOS AArch64 (NEON + scalar + shared)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify AArch64 NEON target
        run: |
          clang++ -dM -E -x c++ /dev/null | grep -E '__aarch64__|__ARM_NEON'

      - name: Build and test (NEON Release)
        run: |
          cmake -S . -B build/rel -DCMAKE_BUILD_TYPE=Release
          cmake --build build/rel -j
          ctest --test-dir build/rel --output-on-failure

      - name: Build and test (scalar / ARIXV_NO_SIMD)
        run: |
          cmake -S . -B build/scalar -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-DARIXV_NO_SIMD"
          cmake --build build/scalar -j
          ctest --test-dir build/scalar --output-on-failure

      - name: Build and test (shared + Mach-O export check + C11/C++17 consumers)
        run: |
          cmake -S . -B build/shared -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON
          cmake --build build/shared -j
          ctest --test-dir build/shared --output-on-failure
          exported=$(nm -gU build/shared/libarixv.dylib | awk '{print $3}' | sort)
          expected=$(printf '%s\n' _arixv_decode _arixv_encode _arixv_encode_bound _arixv_inspect _arixv_status_string _arixv_version _arixv_pack_decode _arixv_pack_decode_stage1 _arixv_pack_decode_stage2 _arixv_pack_encode _arixv_pack_encode_bound _arixv_pack_inspect _arixv_pack_inspect_modules _arixv_pack_reset_scratch | sort)
          if [ "$exported" != "$expected" ]; then
            echo "ERROR: Unexpected exported symbols in libarixv.dylib:"
            echo "$exported"
            exit 1
          fi
          cmake --install build/shared --prefix "$PWD/build/install-shared"
          for lang in C CXX; do
            bdir="build/consumer-shared-${lang}"
            cmake -S tests/consumer -B "$bdir" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$PWD/build/install-shared" \
              -DARIXV_CONSUMER_LANG="$lang" \
              -DARIXV_CONSUMER_MODE=find_package \
              -DARIXV_CONSUMER_TARGETS=both
            cmake --build "$bdir" -j
            "./$bdir/consumer_smoke"
          done
          for shared in OFF ON; do
            for lang in C CXX; do
              bdir="build/consumer-fc-${shared}-${lang}"
              cmake -S tests/consumer -B "$bdir" \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS="$shared" \
                -DARIXV_CONSUMER_LANG="$lang" \
                -DARIXV_CONSUMER_MODE=fetchcontent \
                -DARIXV_CONSUMER_SOURCE_DIR="$PWD" \
                -DARIXV_CONSUMER_TARGETS=both
              cmake --build "$bdir" -j
              "./$bdir/consumer_smoke"
            done
          done

  windows-msvc:
    name: Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test (Release SSE2 + C11/C++17 static consumers)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Checked {
            $global:LASTEXITCODE = 0
            $exe = $args[0]
            if ($args.Length -gt 1) {
              $rest = $args[1..($args.Length - 1)]
              & $exe @rest
            } else {
              & $exe
            }
            if ($LASTEXITCODE -ne 0) { throw "Command failed ($LASTEXITCODE): $($args -join ' ')" }
          }
          Invoke-Checked cmake -S . -B build/rel -A x64
          Invoke-Checked cmake --build build/rel --config Release --parallel
          Invoke-Checked ctest --test-dir build/rel -C Release --output-on-failure
          Invoke-Checked cmake --install build/rel --config Release --prefix "$PWD/build/install-static"
          foreach ($lang in @("C", "CXX")) {
            foreach ($tgt in @("decoder", "both")) {
              $bdir = "build/consumer-static-$lang-$tgt"
              Invoke-Checked cmake -S tests/consumer -B $bdir -A x64 `
                -DCMAKE_PREFIX_PATH="$PWD/build/install-static" `
                -DARIXV_CONSUMER_LANG="$lang" `
                -DARIXV_CONSUMER_MODE=find_package `
                -DARIXV_CONSUMER_TARGETS="$tgt"
              Invoke-Checked cmake --build $bdir --config Release --parallel
              Invoke-Checked ".\$bdir\Release\consumer_smoke.exe"
            }
          }

      - name: Build and test (Shared DLL + export check + C11/C++17 consumers)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Checked {
            $global:LASTEXITCODE = 0
            $exe = $args[0]
            if ($args.Length -gt 1) {
              $rest = $args[1..($args.Length - 1)]
              & $exe @rest
            } else {
              & $exe
            }
            if ($LASTEXITCODE -ne 0) { throw "Command failed ($LASTEXITCODE): $($args -join ' ')" }
          }
          Invoke-Checked cmake -S . -B build/shared -A x64 -DBUILD_SHARED_LIBS=ON
          Invoke-Checked cmake --build build/shared --config Release --parallel
          Invoke-Checked ctest --test-dir build/shared -C Release --output-on-failure

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $dll = "build\shared\bin\Release\arixv.dll"
          $dumpOut = & $dumpbin /exports $dll
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed ($LASTEXITCODE)" }
          $exported = @(
            $dumpOut | ForEach-Object {
              if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)') { $Matches[1] }
            } | Sort-Object
          )
          $expected = @(@("arixv_decode", "arixv_encode", "arixv_encode_bound", "arixv_inspect", "arixv_status_string", "arixv_version", "arixv_pack_decode", "arixv_pack_decode_stage1", "arixv_pack_decode_stage2", "arixv_pack_encode", "arixv_pack_encode_bound", "arixv_pack_inspect", "arixv_pack_inspect_modules", "arixv_pack_reset_scratch") | Sort-Object)
          if (($exported -join ",") -ne ($expected -join ",")) {
            throw "Unexpected DLL exports: $($exported -join ', ')"
          }

          Invoke-Checked cmake --install build/shared --config Release --prefix "$PWD/build/install-shared"
          $env:PATH = "$PWD\build\install-shared\bin;$env:PATH"
          foreach ($lang in @("C", "CXX")) {
            foreach ($tgt in @("decoder", "both")) {
              $bdir = "build/consumer-shared-$lang-$tgt"
              Invoke-Checked cmake -S tests/consumer -B $bdir -A x64 `
                -DCMAKE_PREFIX_PATH="$PWD/build/install-shared" `
                -DARIXV_CONSUMER_LANG="$lang" `
                -DARIXV_CONSUMER_MODE=find_package `
                -DARIXV_CONSUMER_TARGETS="$tgt"
              Invoke-Checked cmake --build $bdir --config Release --parallel
              Invoke-Checked ".\$bdir\Release\consumer_smoke.exe"
            }
          }

          foreach ($lang in @("C", "CXX")) {
            $bdir = "build/consumer-fc-$lang"
            Invoke-Checked cmake -S tests/consumer -B $bdir -A x64 `
              -DARIXV_CONSUMER_LANG="$lang" `
              -DARIXV_CONSUMER_MODE=fetchcontent `
              -DARIXV_CONSUMER_SOURCE_DIR="$PWD" `
              -DARIXV_CONSUMER_TARGETS=both
            Invoke-Checked cmake --build $bdir --config Release --parallel
            Invoke-Checked ".\$bdir\Release\consumer_smoke.exe"
          }

      - name: Build and test (scalar / ARIXV_NO_SIMD)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Checked {
            $global:LASTEXITCODE = 0
            $exe = $args[0]
            if ($args.Length -gt 1) {
              $rest = $args[1..($args.Length - 1)]
              & $exe @rest
            } else {
              & $exe
            }
            if ($LASTEXITCODE -ne 0) { throw "Command failed ($LASTEXITCODE): $($args -join ' ')" }
          }
          Invoke-Checked cmake -S . -B build/scalar -A x64 -DCMAKE_CXX_FLAGS="/DARIXV_NO_SIMD"
          Invoke-Checked cmake --build build/scalar --config Release --parallel
          Invoke-Checked ctest --test-dir build/scalar -C Release --output-on-failure

      - name: Build and test (no-exceptions /EHs-c- /D_HAS_EXCEPTIONS=0 /GR-)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Checked {
            $global:LASTEXITCODE = 0
            $exe = $args[0]
            if ($args.Length -gt 1) {
              $rest = $args[1..($args.Length - 1)]
              & $exe @rest
            } else {
              & $exe
            }
            if ($LASTEXITCODE -ne 0) { throw "Command failed ($LASTEXITCODE): $($args -join ' ')" }
          }
          Invoke-Checked cmake -S . -B build/noexc -A x64 `
            -DCMAKE_CXX_FLAGS="/DWIN32 /D_WINDOWS /EHs-c- /D_HAS_EXCEPTIONS=0 /GR-"
          Invoke-Checked cmake --build build/noexc --config Release --parallel
          Invoke-Checked ctest --test-dir build/noexc -C Release --output-on-failure
